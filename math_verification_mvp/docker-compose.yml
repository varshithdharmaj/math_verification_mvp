version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    environment:
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/docs" ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: python:3.10-slim
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    command: python -m http.server 8080
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: mvm2-network
